# Optional: docker compose -f compose.yaml -f compose.https.yaml up -d --build
# No certificate or private key is baked into the image or public Web release.
services:
  web:
    ports:
      - '${WEB_HTTPS_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTPS_PORT:-28443}:8443'
    group_add:
      - '${TLS_CERT_GID:?Create the mysold-tls group and set TLS_CERT_GID in .env}'
    volumes:
      - type: bind
        source: ./frontend/nginx-tls.conf
        target: /etc/nginx/mysold-tls/https.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: '${TLS_CERTS_DIR:?Set TLS_CERTS_DIR in .env to your private certificate directory}'
        target: /etc/nginx/mysold-certs
        read_only: true
        bind:
          create_host_path: false
