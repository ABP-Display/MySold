name: mysold
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysold}
      POSTGRES_USER: ${POSTGRES_USER:-mysold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/backups:/backups
    healthcheck:
      test: [CMD-SHELL, '[ "$$(cat /proc/1/comm)" = postgres ] && pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
  keys:
    build: ./backend
    user: '0:0'
    command: [python, encryption.py, init-key]
    environment:
      MYSOLD_KEY_FILE: /keys/master.key
    volumes:
      - ./data/keys:/keys
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      APP_ORIGIN: ${APP_ORIGIN-http://localhost:${WEB_PORT:-28080},https://mysold.ydoxide.fr}
      POSTGRES_DB: ${POSTGRES_DB:-mysold}
      POSTGRES_USER: ${POSTGRES_USER:-mysold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      PUBLIC_INDEXING: ${PUBLIC_INDEXING:-true}
      PUBLIC_OPERATOR_NAME: ${PUBLIC_OPERATOR_NAME:-}
      PUBLIC_OPERATOR_ADDRESS: ${PUBLIC_OPERATOR_ADDRESS:-}
      PUBLIC_CONTACT_URL: ${PUBLIC_CONTACT_URL:-https://github.com/ABP-Display/MySold}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:-}
      PUBLIC_HOSTING_NAME: ${PUBLIC_HOSTING_NAME:-}
      PUBLIC_HOSTING_ADDRESS: ${PUBLIC_HOSTING_ADDRESS:-}
      PUBLIC_HOSTING_CONTACT: ${PUBLIC_HOSTING_CONTACT:-}
      PUBLIC_HOSTING_REGION: ${PUBLIC_HOSTING_REGION:-}
      PUBLIC_LOG_RETENTION: ${PUBLIC_LOG_RETENTION:-}
      PUBLIC_BACKUP_RETENTION: ${PUBLIC_BACKUP_RETENTION:-}
      MYSOLD_KEY_FILE: /keys/master.key
    volumes:
      - ./data/keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database, web]
  web:
    build:
      context: ./frontend
      dockerfile: ${WEB_DOCKERFILE:-Dockerfile}
      args:
        MYSOLD_REPOSITORY: ${MYSOLD_REPOSITORY:-ABP-Display/MySold}
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.44.0}
    restart: unless-stopped
    environment:
      TLS_ENABLED: ${TLS_ENABLED:-false}
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-28080}:8080'
      - '${WEB_HTTPS_BIND_ADDRESS:-0.0.0.0}:${WEB_HTTPS_PORT:-28443}:8443'
    group_add:
      - '${TLS_CERT_GID:-101}'
    volumes:
      - type: bind
        source: '${TLS_CERTS_DIR:-./data/tls}'
        target: /etc/nginx/mysold-certs
        read_only: true
        bind:
          create_host_path: true
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [web]
networks:
  database:
    internal: true
  web:
