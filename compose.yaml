name: mysold
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysold}
      POSTGRES_USER: ${POSTGRES_USER:-mysold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      APP_ORIGIN: ${APP_ORIGIN-http://localhost:28085,https://mysold.ydoxide.fr}
      POSTGRES_DB: ${POSTGRES_DB:-mysold}
      POSTGRES_USER: ${POSTGRES_USER:-mysold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup.mjs}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database, web]
  web:
    build:
      context: ./frontend
      args:
        FLUTTER_VERSION: ${FLUTTER_VERSION:-3.44.0}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-28085}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [web]
volumes:
  postgres_data:
networks:
  database:
    internal: true
  web:
