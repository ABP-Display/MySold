name: mysold
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mysold}
      POSTGRES_USER: ${POSTGRES_USER:-mysold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: /run/mysold/postgres_password
    # Prepare a private, persistent secret before the official PostgreSQL startup.
    # UID 10001 is the API user defined in backend/Dockerfile.
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        umask 077
        mkdir -p /backups
        chmod 700 /backups
        if [ -s "$$POSTGRES_PASSWORD_FILE" ]; then
          if [ -n "$$POSTGRES_PASSWORD" ] && [ "$$POSTGRES_PASSWORD" != "$$(cat "$$POSTGRES_PASSWORD_FILE")" ]; then
            echo 'POSTGRES_PASSWORD differs from data/config/postgres_password. Keep the existing secret.' >&2
            exit 1
          fi
        else
          if [ -s "$$PGDATA/PG_VERSION" ] && [ -z "$$POSTGRES_PASSWORD" ]; then
            echo 'Existing database: restore data/config/postgres_password or provide its original POSTGRES_PASSWORD.' >&2
            exit 1
          fi
          temporary=$$(mktemp /run/mysold/.postgres_password.XXXXXX)
          if [ -n "$$POSTGRES_PASSWORD" ]; then
            printf '%s' "$$POSTGRES_PASSWORD" > "$$temporary"
          else
            od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > "$$temporary"
            [ "$$(wc -c < "$$temporary")" -eq 64 ]
          fi
          mv "$$temporary" "$$POSTGRES_PASSWORD_FILE"
        fi
        chown 10001:10001 /run/mysold "$$POSTGRES_PASSWORD_FILE"
        chmod 700 /run/mysold
        chmod 600 "$$POSTGRES_PASSWORD_FILE"
        unset POSTGRES_PASSWORD
        exec docker-entrypoint.sh postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/config:/run/mysold
      - ./data/backups:/backups
    healthcheck:
      test: [CMD-SHELL, '[ "$$(cat /proc/1/comm)" = postgres ] && pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [database]
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      APP_ORIGIN: ${APP_ORIGIN-http://localhost:28085,https://mysold.ydoxide.fr}
      POSTGRES_DB: ${POSTGRES_DB:-mysold}
      POSTGRES_USER: ${POSTGRES_USER:-mysold}
      POSTGRES_PASSWORD_FILE: /run/mysold/postgres_password
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/config:/run/mysold:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database, web]
  web:
    build:
      context: ./frontend
      args:
        MYSOLD_REPOSITORY: ${MYSOLD_REPOSITORY:-ABP-Display/MySold}
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-28085}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, -q, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [web]
networks:
  database:
    internal: true
  web:
