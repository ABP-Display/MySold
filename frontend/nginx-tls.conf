# Included by the entrypoint when TLS_ENABLED=true; keys are mounted separately.
listen 8443 ssl;
ssl_certificate /etc/nginx/mysold-certs/fullchain.pem;
ssl_certificate_key /etc/nginx/mysold-certs/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:MySoldTLS:1m;
ssl_session_timeout 10m;
ssl_session_tickets off;
