server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    client_max_body_size 4m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/javascript application/wasm text/css application/json image/svg+xml font/ttf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location = /version.json {
        expires -1;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
