map "$scheme:$http_x_forwarded_proto" $mysold_hsts {
    default "";
    ~^https: "max-age=31536000";
    "http:https" "max-age=31536000";
}
map $uri $mysold_robots {
    default "";
    / "noindex, follow";
    /app/ "noindex, follow";
    /index.html "noindex, follow";
}
server {
    listen 8080;
    # Only populated by the container entrypoint when TLS is enabled.
    include /tmp/mysold-tls/*.conf;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    include /etc/nginx/mime.types;
    client_max_body_size 4m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript text/javascript application/wasm text/css application/json image/svg+xml font/ttf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security $mysold_hsts always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag $mysold_robots always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    error_page 404 /_mysold_not_found;
    location = /_mysold_not_found {
        internal;
        proxy_pass $api_upstream/public-not-found;
        proxy_set_header Host $http_host;
    }
    location = / {
        absolute_redirect off;
        if ($arg_presentation = 1) {
            return 301 /presentation;
        }
        try_files /index.html =404;
        expires -1;
    }
    location = /app {
        absolute_redirect off;
        return 308 /app/$is_args$args;
    }
    location = /app/ {
        # The Flutter bundle and its base href remain at the domain root.
        try_files /index.html =404;
        expires -1;
    }
    location ~ ^/(presentation|decouvrir|confidentialite|conditions|mentions-legales|cookies)/?$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
    }
    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
    }
    location ^~ /site-assets/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
    }
    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }
    location ^~ /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location = /version.json {
        expires -1;
        try_files $uri =404;
    }
    location ~* \.(png|webp|jpe?g|ico|woff2?|ttf|otf|wasm)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / {
        # Flutter navigation uses hashes; unknown server paths must be real 404s.
        try_files $uri $uri/ =404;
        expires -1;
    }
}
