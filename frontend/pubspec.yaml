name: mysold
description: MySold, gestion financière personnelle auto-hébergée.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.8.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: any
  hive_flutter: ^1.1.0
  hive: any
  path: any
  pdf: any
  file_saver: ^0.4.0
  file_picker: any
  fl_chart: ^0.63.0
  intl: any
  shared_preferences: ^2.2.2
  provider: any
  crypto: any
  qr: ^3.0.2
  http: ^1.2.2
  flutter_iconpicker: 4.0.3
  flutter_colorpicker: ^1.0.3
  pin_code_fields: ^8.0.0
  sensors_plus: ^6.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^3.3.0
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP.ttf
    - family: NotoEmoji
      fonts:
        - asset: assets/fonts/NotoEmoji.ttf
