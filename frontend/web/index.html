<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="MySold - Gestion de budget et patrimoine auto-hébergée.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MySold">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MySold</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #000; }
    #mysold-startup { position: fixed; inset: 0; z-index: 2147483647; background: #000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
    #mysold-startup img { width: 112px; height: 112px; object-fit: contain; }
    .mysold-loader { width: 26px; height: 26px; border: 3px solid #262626; border-top-color: #b2cfa6;
      border-radius: 50%; animation: mysold-spin 1s linear infinite; }
    @keyframes mysold-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .mysold-loader { animation: none; } }
  </style>
</head>
<body>
  <div id="mysold-startup" role="status" aria-label="MySold">
    <img src="assets/assets/icons/logo.png" alt="MySold" width="112" height="112">
    <span class="mysold-loader" aria-hidden="true"></span>
  </div>
  <script src="privacy_gesture.js"></script>
  <script src="pwa_updates.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
